# Flight path for database capture
# Suggested waypoints for systematic image capture
capture_flight_path:
  altitude: 50  # meters AGL
  speed: 5      # m/s
  waypoints:
    - [33.7480, 73.1355]  # NW corner
    - [33.7480, 73.1385]  # NE corner
    - [33.7475, 73.1385]  # Move south
    - [33.7475, 73.1355]  # Move west
    - [33.7470, 73.1355]  # Continue pattern
    - [33.7470, 73.1385]
    - [33.7465, 73.1385]
    - [33.7465, 73.1355]
    - [33.7460, 73.1355]  # SW corner
    - [33.7460, 73.1385]  # SE corner