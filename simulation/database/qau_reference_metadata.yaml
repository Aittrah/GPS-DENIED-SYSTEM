# QAU Campus Reference Image Database Metadata
# This file defines the reference images for visual navigation testing
# at Quaid-i-Azam University Campus, Islamabad, Pakistan

database:
  name: "QAU Campus Reference Database"
  version: "1.0.0"
  created: "2024-01-01"
  location: "QAU Campus, Islamabad, Pakistan"
  
  # Geographic center of the database coverage
  center:
    latitude: 33.7470
    longitude: 73.1370
    altitude: 550  # meters MSL
    
  # Coverage bounds
  bounds:
    min_latitude: 33.740
    max_latitude: 33.755
    min_longitude: 73.130
    max_longitude: 73.145

