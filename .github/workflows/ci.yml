name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -e ".[dev]"

      - name: Run test suite
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests/ -q

  ros-humble-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install ROS package dependencies
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y --rosdistro humble

      - name: Build ROS package
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select vns --symlink-install

      - name: Verify ROS package discovery
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 pkg prefix vns
